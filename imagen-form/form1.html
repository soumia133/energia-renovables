<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <section class="bg-white py-12 px-6 md:px-16 lg:px-32 font-sans">
  <div class="text-center mb-10">
    <h2 class="text-4xl font-bold text-green-800">¿Hablamos?</h2>
    <p class="text-gray-600 mt-2">Estamos encantados de impulsar ideas sostenibles contigo 🌎</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-start">
    <!-- Información de contacto -->
    <div class="space-y-6">
      <div class="flex items-start gap-4">
        <i class="fas fa-map-marker-alt text-green-600 text-xl mt-1"></i>
        <div>
          <h3 class="text-green-700 font-semibold">Dirección</h3>
          <p class="text-gray-600">Plaza España, Zaragoza<br>Aragón, España</p>
        </div>
      </div>
      <div class="flex items-start gap-4">
        <i class="fas fa-envelope text-green-600 text-xl mt-1"></i>
        <div>
          <h3 class="text-green-700 font-semibold">Correo</h3>
          <p class="text-gray-600">info@energia-verde.com</p>
        </div>
      </div>
      <div class="flex items-start gap-4">
        <i class="fas fa-phone-alt text-green-600 text-xl mt-1"></i>
        <div>
          <h3 class="text-green-700 font-semibold">Teléfono</h3>
          <p class="text-gray-600">+34 976 123 456</p>
        </div>
      </div>
    </div>

    <!-- Formulario -->
    <form class="space-y-4 bg-gray-100 p-6 rounded-lg shadow-md">
      <input type="text" placeholder="Tu nombre" class="w-full p-3 rounded border border-gray-300 focus:ring-2 focus:ring-green-400" />
      <input type="email" placeholder="Tu correo electrónico" class="w-full p-3 rounded border border-gray-300 focus:ring-2 focus:ring-green-400" />
      <textarea rows="4" placeholder="Tu mensaje..." class="w-full p-3 rounded border border-gray-300 focus:ring-2 focus:ring-green-400"></textarea>
      <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">Enviar</button>
    </form>
  </div>
</section>

</body>
</html>
